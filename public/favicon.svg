<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- App icon background -->
  <rect width="32" height="32" rx="7" fill="#4f46e5"/>
  <!-- Clock face ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="1.8" stroke-opacity="0.9"/>
  <!-- Hour tick marks at 12, 3, 6, 9 -->
  <line x1="16" y1="7" x2="16" y2="9" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="25" y1="16" x2="23" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="16" y1="25" x2="16" y2="23" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="7" y1="16" x2="9" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- Hour hand (~10 o'clock) -->
  <line x1="16" y1="16" x2="11.5" y2="11.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand (~12 o'clock) -->
  <line x1="16" y1="16" x2="16" y2="8.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="white"/>
</svg>
